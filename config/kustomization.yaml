apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - rbac/serviceaccount.yaml
  - rbac/clusterrole.yaml
  - rbac/clusterrolebinding.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

patches:
  - path: patches/resource_limits.yaml
    target:
      kind: Deployment
      name: node-taint-controller
