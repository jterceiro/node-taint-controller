apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-taint-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-taint-controller
    app.kubernetes.io/component: controller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-taint-controller
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
