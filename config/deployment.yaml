apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-taint-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: node-taint-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node-taint-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-taint-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: node-taint-controller
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/jterceiro/node-taint-controller:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
            - --leader-elect=true
            - --config-namespace=kube-system
            - --config-name=node-taint-controller-config
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
