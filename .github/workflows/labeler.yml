---
name: "Pull Request Labeler"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Label PR based on file changes
        uses: jterceiro/gh-labeler@v1.0
        with:
          config-path: "labeler.yml"
          verbose: "true"
          create-missing-labels: "true"
