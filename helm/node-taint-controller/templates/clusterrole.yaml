apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "node-taint-controller.fullname" . }}
  labels:
    {{- include "node-taint-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
rules:
  # Watch and patch nodes (taints live in spec; annotations in metadata).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Read the controller ConfigMap.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Leader election requires leases.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch", "delete"]
  # Allow the controller to emit events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
