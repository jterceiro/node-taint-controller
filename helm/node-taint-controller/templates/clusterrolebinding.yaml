apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "node-taint-controller.fullname" . }}
  labels:
    {{- include "node-taint-controller.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "node-taint-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "node-taint-controller.serviceAccountName" . }}
    namespace: {{ include "node-taint-controller.namespace" . }}
